name: generate arcade contribution graphs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
      permissions:
        contents: write
      runs-on: ubuntu-latest
      timeout-minutes: 20
      
      steps:
        # 1. Checkout repositori agar runner mengenali workspace Anda
        - name: Checkout repository
          uses: actions/checkout@v4

        # 2. Menghasilkan SVG kontribusi Pac-man
        - name: generate contribution graph SVGs
          uses: abozanona/pacman-contribution-graph@main
          with:
            github_user_name: ${{ github.repository_owner }}
            games: 'pacman'

        # 3. Membuat folder 'dist' dan memindahkan file SVG ke dalamnya
        - name: Move SVGs to dist directory
          run: |
            mkdir -p dist
            mv pacman-contribution-graph*.svg dist/ || true

        # 4. Melakukan push isi folder 'dist' ke branch 'output'
        - name: push SVGs to the output branch
          uses: crazy-max/ghaction-github-pages@v3.1.0
          with:
            target_branch: output
            build_dir: dist
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
